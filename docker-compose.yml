services:
  postgres:
    image: postgres:17-alpine
    container_name: proseguit-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: proseguit
      POSTGRES_PASSWORD: proseguit
      POSTGRES_DB: proseguit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proseguit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

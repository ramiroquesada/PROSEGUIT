# ── PROSEGUIT — Docker Compose PRODUCCIÓN ────────────────────────────────────
#
# Uso:
#   1. Copiar .env.production.example → .env.production y completar los valores
#   2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Servicios:
#   postgres  — PostgreSQL 17 (datos persistidos en volumen)
#   backend   — API Express en puerto 3001 (interno, no expuesto al host)
#   frontend  — nginx sirviendo React + proxy /api → backend (expuesto en :80)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proseguit
      POSTGRES_USER: proseguit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proseguit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://proseguit:${POSTGRES_PASSWORD}@postgres:5432/proseguit
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:

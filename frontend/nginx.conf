server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy de /api y /uploads al servicio backend en Docker Compose
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        # nginx corta en 1 MB por defecto y las fotos de celular pesan 2-8 MB.
        # Tiene que ser mayor que el límite de multer en equipment.routes.ts.
        client_max_body_size 12m;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA: todas las rutas que no sean archivos estáticos van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre (generados por Vite)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
